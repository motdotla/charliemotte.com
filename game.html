<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zombie Slayer!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: monospace;
    color: #fff;
  }
  canvas {
    image-rendering: pixelated;
    border: 4px solid #555;
    cursor: crosshair;
  }
  #ui {
    display: flex;
    gap: 40px;
    margin-bottom: 10px;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  #hp { color: #f55; }
  #score { color: #ff0; }
  #wave { color: #5af; }
  #instructions {
    margin-top: 10px;
    font-size: 12px;
    color: #888;
  }
  #overlay {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  #overlay h1 { font-size: 48px; color: #f55; text-shadow: 3px 3px #800; }
  #overlay p { font-size: 20px; color: #fff; }
  #overlay button {
    font-size: 20px;
    font-family: monospace;
    background: #f55;
    color: #fff;
    border: none;
    padding: 12px 32px;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 2px;
  }
  #overlay button:hover { background: #f88; }
</style>
</head>
<body>
<div id="ui">
  <span id="hp">❤️ HP: 100</span>
  <span id="score">💀 KILLS: 0</span>
  <span id="wave">🌊 WAVE: 1</span>
</div>
<canvas id="canvas" width="640" height="480"></canvas>
<div id="instructions">WASD / Arrow Keys = Move &nbsp;|&nbsp; SPACE or Click = Swing Sword</div>

<div id="overlay">
  <h1>⚔️ ZOMBIE SLAYER</h1>
  <p>Survive the zombie horde!</p>
  <button id="startBtn">▶ START GAME</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = 640, H = 480;
const TILE = 32;

// ─── Pixel drawing helpers ───────────────────────────────────────────────────
function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), w, h);
}

function drawPlayer(x, y, dir, swingTimer, hp) {
  const px = Math.round(x - 8), py = Math.round(y - 16);
  // shadow
  rect(px + 2, py + 30, 12, 4, 'rgba(0,0,0,0.3)');
  // legs
  rect(px + 2, py + 20, 5, 10, '#3366cc');
  rect(px + 9, py + 20, 5, 10, '#3366cc');
  // body
  rect(px, py + 8, 16, 14, '#cc3333');
  // head
  rect(px + 2, py, 12, 12, '#ffcc99');
  // eyes
  rect(px + 4, py + 3, 2, 2, '#222');
  rect(px + 10, py + 3, 2, 2, '#222');
  // mouth smile
  rect(px + 5, py + 8, 6, 2, '#a05030');
  // hair
  rect(px + 2, py, 12, 3, '#663300');

  // sword
  if (swingTimer > 0) {
    const angle = (dir === 'right') ? -0.5 + (1 - swingTimer/0.3) * 2 : Math.PI + 0.5 - (1 - swingTimer/0.3) * 2;
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y - 4));
    ctx.rotate(angle);
    // blade
    rect(0, -24, 4, 24, '#ddddff');
    rect(1, -26, 2, 4, '#aaaacc');
    // guard
    rect(-5, -4, 14, 4, '#cc9900');
    // handle
    rect(0, 0, 4, 10, '#996633');
    ctx.restore();
  } else {
    // sword at rest at side
    const sx = (dir === 'right') ? px + 14 : px - 4;
    rect(sx, py + 4, 4, 20, '#ddddff');
    rect(sx - 3, py + 16, 10, 4, '#cc9900');
    rect(sx, py + 20, 4, 8, '#996633');
  }
}

function drawZombie(x, y, hp, maxHp, wobble) {
  const px = Math.round(x - 8), py = Math.round(y - 16);
  // shadow
  rect(px + 2, py + 30, 12, 4, 'rgba(0,0,0,0.3)');
  // legs (stagger)
  rect(px + 2, py + 20, 5, 10, '#2a4a1a');
  rect(px + 9, py + 20, 5, 10, '#1a3a0a');
  // body
  rect(px, py + 8, 16, 14, '#4a6a2a');
  // arms raised (zombie style)
  rect(px - 6, py + 8, 6, 4, '#3a8a3a');
  rect(px + 16, py + 8, 6, 4, '#3a8a3a');
  // head
  rect(px + 2, py, 12, 12, '#7aaa5a');
  // eyes (red!)
  rect(px + 4, py + 3, 3, 3, '#ff2200');
  rect(px + 9, py + 3, 3, 3, '#ff2200');
  // mouth (jagged)
  rect(px + 4, py + 8, 2, 2, '#222');
  rect(px + 7, py + 7, 2, 3, '#222');
  rect(px + 10, py + 8, 2, 2, '#222');
  // hp bar
  const barW = 20;
  rect(px - 2, py - 6, barW, 3, '#400');
  rect(px - 2, py - 6, Math.round(barW * hp / maxHp), 3, '#0f0');
}

function drawParticle(p) {
  ctx.globalAlpha = p.life / p.maxLife;
  rect(p.x, p.y, p.size, p.size, p.color);
  ctx.globalAlpha = 1;
}

// ─── Game state ──────────────────────────────────────────────────────────────
let keys = {};
let mouseDown = false;
let game, animId;

function initGame() {
  game = {
    player: {
      x: W / 2, y: H / 2,
      vx: 0, vy: 0,
      hp: 100, maxHp: 100,
      dir: 'right',
      swingTimer: 0,
      swingCooldown: 0,
      speed: 140,
      invincible: 0,
    },
    zombies: [],
    particles: [],
    score: 0,
    wave: 1,
    waveTimer: 3,
    waveSpawned: 0,
    spawnQueue: 0,
    running: true,
    dead: false,
    cameraX: 0,
    cameraY: 0,
  };
  spawnWave(1);
}

function spawnWave(wave) {
  game.spawnQueue = 5 + wave * 3;
}

function spawnZombie() {
  // spawn off screen edge
  const edge = Math.floor(Math.random() * 4);
  let x, y;
  const cx = game.player.x, cy = game.player.y;
  const pad = 60;
  if (edge === 0) { x = cx + (Math.random() * W - W/2); y = cy - H/2 - pad; }
  else if (edge === 1) { x = cx + W/2 + pad; y = cy + (Math.random() * H - H/2); }
  else if (edge === 2) { x = cx + (Math.random() * W - W/2); y = cy + H/2 + pad; }
  else { x = cx - W/2 - pad; y = cy + (Math.random() * H - H/2); }

  const maxHp = 20 + game.wave * 10;
  game.zombies.push({
    x, y,
    hp: maxHp,
    maxHp,
    speed: 55 + game.wave * 5 + Math.random() * 20,
    wobble: Math.random() * Math.PI * 2,
    attackTimer: 0,
  });
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 40 + Math.random() * 80;
    game.particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.4 + Math.random() * 0.3,
      maxLife: 0.4 + Math.random() * 0.3,
      size: 2 + Math.floor(Math.random() * 4),
      color,
    });
  }
}

function trySwing() {
  if (game.player.swingCooldown <= 0) {
    game.player.swingTimer = 0.3;
    game.player.swingCooldown = 0.45;
  }
}

// ─── Update ──────────────────────────────────────────────────────────────────
let lastTime = 0;
function update(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;

  if (!game.running) return;

  const p = game.player;

  // movement
  let dx = 0, dy = 0;
  if (keys['ArrowLeft']  || keys['a'] || keys['A']) dx -= 1;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
  if (keys['ArrowUp']    || keys['w'] || keys['W']) dy -= 1;
  if (keys['ArrowDown']  || keys['s'] || keys['S']) dy += 1;
  if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }
  if (dx > 0) p.dir = 'right';
  if (dx < 0) p.dir = 'left';

  p.x += dx * p.speed * dt;
  p.y += dy * p.speed * dt;

  // swing timers
  if (p.swingTimer > 0) p.swingTimer -= dt;
  if (p.swingCooldown > 0) p.swingCooldown -= dt;
  if (p.invincible > 0) p.invincible -= dt;

  // auto-swing on space/mouse held
  if ((keys[' '] || mouseDown) && p.swingCooldown <= 0) trySwing();

  // sword hitbox check
  if (p.swingTimer > 0 && p.swingTimer < 0.25) {
    const swordRange = 48;
    const swordOffX = (p.dir === 'right') ? swordRange : -swordRange;
    for (let i = game.zombies.length - 1; i >= 0; i--) {
      const z = game.zombies[i];
      const dist = Math.hypot(z.x - (p.x + swordOffX * 0.6), z.y - (p.y - 4));
      if (dist < 40) {
        const dmg = 20 + Math.floor(Math.random() * 10);
        z.hp -= dmg;
        spawnParticles(z.x, z.y, '#5f0', 5);
        spawnParticles(z.x, z.y, '#cf3', 3);
        if (z.hp <= 0) {
          spawnParticles(z.x, z.y, '#5f0', 12);
          spawnParticles(z.x, z.y, '#2a0', 8);
          game.zombies.splice(i, 1);
          game.score++;
        }
      }
    }
  }

  // zombie AI
  for (const z of game.zombies) {
    z.wobble += dt * 3;
    const angle = Math.atan2(p.y - z.y, p.x - z.x);
    z.x += Math.cos(angle) * z.speed * dt;
    z.y += Math.sin(angle) * z.speed * dt;

    // attack player
    const dist = Math.hypot(z.x - p.x, z.y - p.y);
    z.attackTimer -= dt;
    if (dist < 20 && z.attackTimer <= 0 && p.invincible <= 0) {
      p.hp -= 10;
      p.invincible = 0.6;
      z.attackTimer = 0.8;
      spawnParticles(p.x, p.y, '#f55', 6);
      if (p.hp <= 0) {
        p.hp = 0;
        game.running = false;
        game.dead = true;
      }
    }
  }

  // particles
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const pt = game.particles[i];
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.vx *= 0.85;
    pt.vy *= 0.85;
    pt.life -= dt;
    if (pt.life <= 0) game.particles.splice(i, 1);
  }

  // wave spawning
  if (game.spawnQueue > 0) {
    game.waveTimer -= dt;
    if (game.waveTimer <= 0) {
      spawnZombie();
      game.spawnQueue--;
      game.waveTimer = 0.7;
    }
  } else if (game.zombies.length === 0) {
    // next wave
    game.waveTimer -= dt;
    if (game.waveTimer <= 0) {
      game.wave++;
      game.waveTimer = 2;
      spawnWave(game.wave);
    }
  }

  // camera follows player
  game.cameraX = p.x - W / 2;
  game.cameraY = p.y - H / 2;
}

// ─── Draw ─────────────────────────────────────────────────────────────────────
const GRASS_COLORS = ['#2d5a1b', '#336622', '#2a5218', '#3a6825'];
const DARK_GRASS   = ['#1e3d10', '#264d14', '#1a3a0d'];

// pre-generate grass tiles
const grassPattern = [];
for (let row = 0; row < Math.ceil(H / TILE) + 2; row++) {
  grassPattern.push([]);
  for (let col = 0; col < Math.ceil(W / TILE) + 2; col++) {
    grassPattern[row].push(Math.floor(Math.random() * GRASS_COLORS.length));
    // occasional dark patch
  }
}

function drawWorld() {
  const camX = game.cameraX, camY = game.cameraY;
  const startCol = Math.floor(camX / TILE) - 1;
  const startRow = Math.floor(camY / TILE) - 1;
  const cols = Math.ceil(W / TILE) + 3;
  const rows = Math.ceil(H / TILE) + 3;

  for (let row = startRow; row < startRow + rows; row++) {
    for (let col = startCol; col < startCol + cols; col++) {
      const wx = col * TILE - camX;
      const wy = row * TILE - camY;
      // hash to pick color consistently
      const hash = ((col * 73856093) ^ (row * 19349663)) >>> 0;
      const color = GRASS_COLORS[hash % GRASS_COLORS.length];
      rect(wx, wy, TILE, TILE, color);
      // little pixel details
      if (hash % 5 === 0) rect(wx + (hash % 20), wy + (hash % 18), 4, 2, DARK_GRASS[hash % 3]);
      if (hash % 7 === 0) rect(wx + (hash % 24), wy + (hash % 22), 2, 4, DARK_GRASS[(hash+1) % 3]);
    }
  }
}

function draw() {
  const camX = game.cameraX, camY = game.cameraY;
  ctx.clearRect(0, 0, W, H);
  drawWorld();

  ctx.save();
  ctx.translate(-camX, -camY);

  // draw particles behind entities
  for (const pt of game.particles) drawParticle(pt);

  // draw zombies
  for (const z of game.zombies) {
    drawZombie(z.x, z.y, z.hp, z.maxHp, z.wobble);
  }

  // draw player (flicker when invincible)
  const p = game.player;
  if (p.invincible <= 0 || Math.floor(p.invincible * 10) % 2 === 0) {
    drawPlayer(p.x, p.y, p.dir, p.swingTimer, p.hp);
  }

  ctx.restore();

  // HUD
  // HP bar
  rect(10, H - 26, 104, 14, '#400');
  rect(12, H - 24, Math.round(100 * p.hp / p.maxHp), 10, p.hp > 40 ? '#0f0' : p.hp > 20 ? '#ff0' : '#f00');

  // wave banner
  if (game.spawnQueue === 0 && game.zombies.length === 0) {
    ctx.fillStyle = '#5af';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`WAVE ${game.wave + 1} INCOMING...`, W / 2, 30);
  }

  // update DOM ui
  document.getElementById('hp').textContent    = `❤️ HP: ${p.hp}`;
  document.getElementById('score').textContent = `💀 KILLS: ${game.score}`;
  document.getElementById('wave').textContent  = `🌊 WAVE: ${game.wave}`;
}

// ─── Game loop ────────────────────────────────────────────────────────────────
function loop(ts) {
  update(ts);
  draw();
  if (!game.dead) {
    animId = requestAnimationFrame(loop);
  } else {
    showDead();
  }
}

function showDead() {
  const ov = document.getElementById('overlay');
  ov.innerHTML = `
    <h1>💀 YOU DIED</h1>
    <p>Zombies: ${game.score} killed | Wave: ${game.wave}</p>
    <button id="startBtn">▶ PLAY AGAIN</button>
  `;
  ov.style.display = 'flex';
  document.getElementById('startBtn').onclick = startGame;
}

function startGame() {
  document.getElementById('overlay').style.display = 'none';
  initGame();
  lastTime = performance.now();
  animId = requestAnimationFrame(loop);
}

// ─── Input ────────────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') { e.preventDefault(); trySwing(); }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
canvas.addEventListener('mousedown', e => { mouseDown = true; trySwing(); });
canvas.addEventListener('mouseup',   () => { mouseDown = false; });

document.getElementById('startBtn').onclick = startGame;
</script>
</body>
</html>
